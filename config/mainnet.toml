# MegaETH mainnet config — confirmed against on-chain reads and the
# canonical Aave address book (bgd-labs/aave-address-book/src/AaveV3MegaEth.sol).
#
# Verification done:
#   * Chain ID 4326    — chainlist.org
#   * RPC + WS         — docs.megaeth.com
#   * Aave V3 contracts — bgd-labs/aave-address-book @ commit on main
#   * Token symbols/decimals — `cast call` against mainnet RPC
#
# DEX entries are still placeholders pending user confirmation of which
# venues to target (top 2-3 by 24h volume).

[network]
name        = "megaeth-mainnet"
chain_id    = 4326
rpc_urls    = [
    "https://mainnet.megaeth.com/rpc",   # public — replace with managed endpoint for prod
]
realtime_ws = "wss://mainnet.megaeth.com/ws"   # TODO: confirm exact path from docs.megaeth.com/realtime-api
explorer    = "https://mega.etherscan.io"

[aave]
# Aave V3 deployment — see github.com/bgd-labs/aave-address-book/blob/main/src/AaveV3MegaEth.sol
pool                       = "0x7e324AbC5De01d112AfC03a584966ff199741C28"
pool_addresses_provider    = "0x46Dcd5F4600319b02649Fd76B55aA6c1035CA478"
oracle                     = "0x421117D7319E96d831972b3F7e970bbfe29C4F21"
data_provider              = "0x9588b453A4EE24a420830CB3302195cA7aA3b403"

# Borrowable via flashLoanSimple (user-confirmed via app.aave.com/proto_megaeth_v3).
# Phase 1 strategy uses these as the loan-and-repay leg of every cycle.
flashloan_assets = [
    "0xFAfDdbb3FC7688494971a79cc65DCa3EF82079E7",  # USDm
    "0x5d3a1Ff2b6BAb83b63cd9AD0787074081a52ef34",  # USDe
    "0xB8CE59FC3717ada4C02eaDF9682A9e934F625ebb",  # USDT0
]

# DEX list. Each entry verified on-chain (factory bytecode present, fee
# tiers configured, representative pools queried for liquidity).

