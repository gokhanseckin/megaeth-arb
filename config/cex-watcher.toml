# CEX↔DEX correlation watcher (Phase A: dual-stream logger).
#
# Independent of the flash-loan watcher. Re-uses mainnet.toml's [network],
# [[tokens]], and [[pools]] for the on-chain side via dex_config_path —
# pool addresses live in exactly one place.

dex_config_path = "mainnet.toml"

[binance]
ws_url        = "wss://data-stream.binance.vision"
rest_url      = "https://api.binance.com"
symbols       = ["ETHUSDT", "BTCUSDT"]
# Trades below this notional get logged with `small=true`. Useful filter for
# the offline analyzer; we still record them so signal-vs-noise is visible.
min_trade_usd = 5_000.0

# Map each Binance symbol to a DEX pair label that appears in mainnet.toml's
# [[pools]]. `base`/`quote` reference [[tokens]] symbols — they tell the
# pricing helper which side to render quote-per-base on (e.g. USDm per WETH).
[[pair_map]]
binance  = "ETHUSDT"
dex_pair = "WETH/USDm"
base     = "WETH"
quote    = "USDm"

[[pair_map]]
binance  = "ETHUSDT"
dex_pair = "WETH/USDT0"
base     = "WETH"
quote    = "USDT0"

[[pair_map]]
binance  = "BTCUSDT"
dex_pair = "BTC.b/USDm"
base     = "BTCb"
quote    = "USDm"
